# Source allowlist for the AI Daily pipeline.
#
# tier 1 = PRIMARY. The organisation speaking about itself, a regulator, or a
#          peer-reviewed/preprint venue. Trusted on its own.
# tier 2 = ESTABLISHED PRESS. Real newsrooms with corrections policies.
#          Needs either a tier-1 link in the article or a second tier-2 report.
# tier 3 = SIGNAL ONLY. Useful for spotting a story early, never publishable
#          alone. Requires two independent corroborations.
#
# Nothing outside this file can ever reach a post. Add sources deliberately.

sources:
  # ---------------- Tier 1: official lab & vendor announcements -------------
  - name: OpenAI Blog
    url: https://openai.com/blog/rss.xml
    tier: 1
    tags: [lab]
  # Anthropic publishes no official RSS feed. This is a community-maintained
  # mirror (github.com/taobojlen/anthropic-rss-feed) that republishes
  # anthropic.com/news verbatim via a scheduled GitHub Action - the content is
  # still Anthropic's own words, just proxied through an unofficial pipe that
  # could break without notice. Revisit if it ever goes stale.
  - name: Anthropic News
    url: https://raw.githubusercontent.com/taobojlen/anthropic-rss-feed/main/anthropic_news_rss.xml
    tier: 1
    tags: [lab]
  - name: Google DeepMind Blog
    url: https://deepmind.google/blog/rss.xml
    tier: 1
    tags: [lab]
  - name: Google Research Blog
    url: https://research.google/blog/rss/
    tier: 1
    tags: [lab]
  # ai.meta.com/blog has no RSS feed at all (checked directly - no <link
  # rel="alternate"> tag in the page). Meta's corporate Newsroom feed does
  # exist and is officially theirs, but it is NOT AI-specific - it carries
  # general PR, policy, and product news too. Tagged "press" (despite tier 1)
  # so the topic-keyword filter still applies and non-AI items get dropped.
  - name: Meta Newsroom
    url: https://about.fb.com/news/feed/
    tier: 1
    tags: [lab, press]
  - name: Microsoft Research Blog
    url: https://www.microsoft.com/en-us/research/feed/
    tier: 1
    tags: [lab]
  - name: Microsoft AI Blog
    url: https://news.microsoft.com/source/topics/ai/feed/
    tier: 1
    tags: [lab]
  - name: Cohere Blog
    url: https://cohere.com/blog/rss.xml
    tier: 1
    tags: [lab]
  - name: NVIDIA Blog
    url: https://blogs.nvidia.com/feed/
    tier: 1
    tags: [hardware]
  - name: Hugging Face Blog
    url: https://huggingface.co/blog/feed.xml
    tier: 1
    tags: [openweights]
  - name: Mistral AI News
    url: https://www.mistral.ai/news/rss
    tier: 1
    tags: [lab]
  - name: AWS Machine Learning Blog
    url: https://aws.amazon.com/blogs/machine-learning/feed/
    tier: 1
    tags: [cloud]

  # ---------------- Tier 2: established technology press --------------------
  - name: TechCrunch AI
    url: https://techcrunch.com/category/artificial-intelligence/feed/
    tier: 2
    tags: [press]
  - name: The Verge AI
    url: https://www.theverge.com/rss/ai-artificial-intelligence/index.xml
    tier: 2
    tags: [press]
  - name: Ars Technica AI
    url: https://arstechnica.com/ai/feed/
    tier: 2
    tags: [press]
  - name: VentureBeat AI
    url: https://venturebeat.com/category/ai/feed/
    tier: 2
    tags: [press]
  - name: MIT Technology Review
    url: https://www.technologyreview.com/feed/
    tier: 2
    tags: [press]
  - name: IEEE Spectrum AI
    url: https://spectrum.ieee.org/feeds/topic/artificial-intelligence.rss
    tier: 2
    tags: [press]
  - name: Wired AI
    url: https://www.wired.com/feed/tag/ai/latest/rss
    tier: 2
    tags: [press]
  # Reuters discontinued official RSS feeds entirely years ago - the only
  # replacements available are unofficial third-party feed generators, which
  # don't meet the "genuine source" bar. Removed rather than faked.

  # ---------------- Tier 3: signal only, never publishable alone ------------
  - name: Hacker News (AI front page)
    url: https://hnrss.org/frontpage?q=AI+OR+LLM+OR+OpenAI+OR+Anthropic
    tier: 3
    tags: [aggregator]
  # Curated AI newsletters: useful for spotting a story early and for
  # corroboration signal, but they summarise other people's reporting rather
  # than doing any of their own - same trust level as an aggregator, not a
  # newsroom. Never publishable alone under the tier-3 rule above.
  - name: Ben's Bites
    url: https://www.bensbites.com/feed
    tier: 3
    tags: [newsletter]
  - name: TLDR AI
    url: https://tldr.tech/api/rss/ai
    tier: 3
    tags: [newsletter]
  - name: The Rundown AI
    url: https://rss.beehiiv.com/feeds/2R3C6Bt5wj.xml
    tier: 3
    tags: [newsletter]
