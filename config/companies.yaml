# Company recognition, used to pick imagery that matches the STORY rather than
# the publisher. Without this, a TechCrunch article about Nvidia falls back to
# the TechCrunch logo - correct attribution, wrong picture.
#
# Aliases are matched as whole words against the headline and summary, longest
# alias first, so "Google DeepMind" wins over "Google".

companies:
  - name: OpenAI
    domain: openai.com
    aliases: [OpenAI, ChatGPT, GPT-4, GPT-5, Sora, DALL-E, Codex]
  - name: Anthropic
    domain: anthropic.com
    aliases: [Anthropic, Claude]
