name: AI Daily

on:
  schedule:
    # 05:00 UTC. GitHub's scheduler drifts under load, so treat this as
    # "shortly after 05:00", not a hard guarantee.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only, publish nothing"
        type: boolean
        default: false
      no_approval:
        description: "Skip the Telegram approval gate"
        type: boolean
        default: false

# Never let two editions build at once.
concurrency:
  group: ai-daily
  cancel-in-progress: false

permissions:
  contents: write        # needed to commit state/seen.json and upload release assets

jobs:
  publish:
    runs-on: ubuntu-latest
    # Generous: most of it is the human approval window (150 min) plus
    # headroom for build/publish either side of it.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system packages
        # This step hung with ZERO output for the full 5-minute timeout on
        # three consecutive attempts - not a slow mirror (that would at
        # least show partial download progress), but the actual signature of
        # a well-known GitHub-hosted-runner issue: Ubuntu's apt-daily.timer
        # runs an automatic background update right after the VM boots and
        # holds the dpkg/apt lock, so any apt-get call early in a job just
        # blocks silently waiting for it. Stop those timers and wait for the
        # lock to clear before touching apt at all. The step-level timeout
        # stays as a hard backstop either way.
        timeout-minutes: 5
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --kill-who=all apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          timeout 60 bash -c 'while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock >/dev/null 2>&1; do sleep 2; done' || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # github_release hosting uses these two automatically.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ASSET_HOST: github_release
        run: |
          python -m aidaily.cli run \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.no_approval && '--no-approval' || '' }} \
            --approval-timeout 9000

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edition-${{ github.run_id }}
          path: |
            out/**/*.png
            out/**/*.mp4
            out/**/edition.json
            out/**/results.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Remember what we posted
        if: success()
        run: |
          if [[ -n "$(git status --porcelain state/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update seen store [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
